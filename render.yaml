# Render Blueprint: the API (Docker web service) and the website (static site), both on the free plan.
# The MySQL database is hosted outside Render (e.g. Aiven's free MySQL). Values marked `sync: false`
# are asked for in the Render dashboard when the Blueprint is applied and are never stored in the repo.
# Both services deploy main automatically, but only after the GitHub checks pass.

services:
  - type: web
    name: mediqueue-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./mediqueue-backend/Dockerfile
    dockerContext: ./mediqueue-backend
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - mediqueue-backend/**
    envVars:
      # full JDBC URL of the hosted MySQL, e.g.
      # jdbc:mysql://mysql-xxxx.aivencloud.com:12345/defaultdb?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # random 256-bit secret generated by Render
      - key: APP_JWT_SECRET
        generateValue: true
      # passwords of the demo accounts created on the first start (admin / everyone else)
      - key: APP_SEED_ADMIN_PASSWORD
        sync: false
      - key: APP_SEED_DEFAULT_PASSWORD
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # the website's address; Render sites are https://<name>.onrender.com
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com
      # free hosted MySQL plans allow only a few connections
      - key: DB_POOL_SIZE
        value: '5'

  - type: web
    name: mediqueue-web
    runtime: static
    rootDir: mediqueue-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - mediqueue-frontend/**
    envVars:
      # the API's address, e.g. https://mediqueue-api.onrender.com (shown on the API service page)
      - key: VITE_API_BASE_URL
        sync: false
      # the Cypress test runner is not needed to build the site
      - key: CYPRESS_INSTALL_BINARY
        value: '0'
    routes:
      # single-page app: every path is served by index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
