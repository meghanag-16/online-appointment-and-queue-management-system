# All values below can be overridden in a local .env file (copy .env.example → .env).
# Defaults keep `docker compose up` working out of the box for local development.

services:
  mysql:
    image: mysql:8.0
    container_name: mediqueue-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: mediqueue
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      # Change MYSQL_HOST_PORT if a local MySQL already uses 3306
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    # The backend Dockerfile lives in mediqueue-backend/, not the repo root
    build: ./mediqueue-backend
    container_name: mediqueue-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mediqueue?useSSL=false&serverTimezone=${APP_TIMEZONE:-Asia/Kolkata}&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # the backend creates and upgrades the schema itself (Flyway, src/main/resources/db/migration)
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # Hospital time zone: "today", slot times and the cancel cutoff all use it
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
      # HS256 needs a key of at least 32 bytes — shorter secrets make every login fail
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-secret-key-for-miniproject-minimum-32-chars}
      # Browser origins allowed to call the API (comma-separated); add your site's address when deploying
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-Admin@123}
      APP_SEED_DEFAULT_PASSWORD: ${APP_SEED_DEFAULT_PASSWORD:-Welcome@123}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    build: ./mediqueue-frontend
    container_name: mediqueue-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"

volumes:
  mysql-data:
