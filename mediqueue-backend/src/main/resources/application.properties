spring.application.name=mediqueue

# ── Database ───────────────────────────────────────────────────────────────
# Hosted MySQL (e.g. Aiven): set the full JDBC URL including ?sslMode=REQUIRED.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mediqueue?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root@123}
# Small pool: free hosted databases allow only a few connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# One time zone everywhere (see MediqueueApplication): JDBC, Hibernate and Jackson use hospital time.
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:Asia/Kolkata}
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Kolkata}

# Schema migrations (src/main/resources/db/migration). An existing database without Flyway's
# history table is marked as version 1 (the initial schema) and only newer migrations run.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ── Security ───────────────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:dev-secret-key-for-miniproject-minimum-32-chars}
# Render (and most hosts) pass the port to listen on in PORT.
server.port=${PORT:8080}

# Browser origins allowed to call the API (comma-separated; "*" wildcards allowed, e.g. https://*.onrender.com).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost}

# ── Demo seed data ─────────────────────────────────────────────────────────
# DataSeeder runs only when the users table is empty (fresh database), so it never
# touches existing data. Disable with APP_SEED_ENABLED=false.
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:Admin@123}
app.seed.default-password=${APP_SEED_DEFAULT_PASSWORD:Welcome@123}

# ── Uploads ────────────────────────────────────────────────────────────────
# Lab report files are stored in the database (max 10 MB each; larger files get a clear 413).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Folder of report files uploaded by older versions, which kept them on disk; still readable.
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# ── Notifications ──────────────────────────────────────────────────────────
# Appointment reminders: one per appointment, sent this many hours before the slot.
# The reminder job runs every interval-ms (default 5 minutes).
app.reminders.hours-before=${APP_REMINDER_HOURS_BEFORE:24}
app.reminders.interval-ms=${APP_REMINDER_INTERVAL_MS:300000}
